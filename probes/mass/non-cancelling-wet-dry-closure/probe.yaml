id: mass/non-cancelling-wet-dry-closure
title: Non-cancelling water conservation through soil wetting-drying transitions
law: mass
track: synthetic
version: 1

authors:
  - name: Zhenjiang Wu
    affiliation: Institute of Global Environmental Change, Xi’an Jiaotong University, Xi’an 710049, China
    orcid: 0000-0002-5329-4917
    github: JustinLoiii

description: >
  Repeated warm wetting, drying, rewetting and recovery blocks expose temporary
  creation and removal of water that cancel within an event or full record.
  Score each interval's external water budget using all reported water stores,
  then accumulate unexplained loss and creation separately within each block.
  The candidate tolerance is calibrated against the four physical baselines.

requires:
  fluxes: [pr, evspsbl, mrro]
  states: [mrso, snw, canopy]

case:
  generator: generate.py
  n_seeds: 5
  timestep: PT1D
  period_years: 1
  spinup_days: 365
  min_window_days: 365
  max_output_mb: 2.0
  max_runtime_s: 60

criteria:
  - non_cancelling_closure:
      threshold: 0.05
      absolute_tolerance_mm: 0.01
      step_deadband_mm: 0.001
      segment_column: _regime
  - closure:
      denominator: sum_pr
      threshold: 0.05
      sinks: [evspsbl, mrro]
  - state_bounds:
      mrso: [0.0, soil_capacity_mm]
      snw: [0.0, null]
      canopy: [0.0, canopy_capacity_mm]
  - forcing_fidelity:
      variables: [pr]
  - non_degenerate:
      runoff_ratio: [0.02, 0.98]
      min_flux_cv: 0.1
      min_response: 0.05
      cv_variables: [mrro, evspsbl]

baselines:
  must_pass: [reference_bucket, flex_lumped, flex_topo, sacsma_snow17]
  must_fail:
    reference_event_storage_reset: non_cancelling_closure

provenance: >
  Synthetic forcing is generated at runtime from the recorded seed. The
  host-only _regime labels delimit contiguous wetting and drying blocks.
  Proposal: https://github.com/Flood-Lab/HydroTuring/issues/136.
