name: reference_event_storage_reset
version: "1.0.0"
description: >
  Deliberately broken reference that adds and removes a temporary 4 mm soil
  storage offset across two consecutive wet steps while leaving forcing, fluxes
  and the final state unchanged. It is used only to gate the non-cancelling
  closure criterion.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: ["python3", "ht_adapter.py"]
timestep: [PT1D]
emits:
  fluxes: [pr, snm, evspsbl, mrro, dis, gwex]
  states: [mrso, snw, canopy, channel]
  diagnostics: [stage]
needs_forcing: [pr, tas, pet]
needs_static: [soil_capacity_mm, canopy_capacity_mm]
uses_static: [area_km2, width_m, cross_section_shape, bed_elevation_m, slope, manning_n]
supports:
  perturbation: false
resources: {cpu: 1, memory_gb: 1, gpu: false}
